<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
		rel="stylesheet">
	<title>Black Market</title>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<script>
		// FiveM NUI fix: normalize URL so SvelteKit router can match routes.
		// NUI opens /ui/build/index.html but router expects /ui/build/ for root route.
		(function() {
			var p = location.pathname;
			if (p.endsWith('/index.html')) {
				history.replaceState(null, '', p.slice(0, -10));
			} else if (p.endsWith('.html')) {
				history.replaceState(null, '', p.slice(0, -5));
			}
		})();
	</script>
	<div>%sveltekit.body%</div>
</body>

</html>
